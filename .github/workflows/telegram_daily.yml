name: Telegram Prompt Publisher

on:
  schedule:
    - cron: "0 7 * * 1-5"    # 08:00 IT  — Lun-Ven (mattino)
    - cron: "0 12 * * 1-5"   # 13:00 IT  — Lun-Ven (pausa pranzo)
    - cron: "30 17 * * 1-5"  # 18:30 IT  — Lun-Ven (sera)
    - cron: "0 7 * * 6"      # 08:00 IT  — Sabato  (recap settimanale)
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot da pubblicare (0=mattino, 1=pausa, 2=sera)"
        required: false
        default: ""
      recap:
        description: "Forza recap settimanale (true/false)"
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install requests python-dotenv Pillow

      - name: Pubblica prompt su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.recap }}" = "true" ]; then
            ARGS="--recap"
          elif [ -n "${{ github.event.inputs.slot }}" ]; then
            ARGS="--slot ${{ github.event.inputs.slot }}"
          fi
          python telegram_prompt_publisher.py $ARGS
